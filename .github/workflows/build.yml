name: Build Windows MSI Installer (Manual)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Windows MSI Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Configure WiX Toolset in PATH
        shell: pwsh
        run: |
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
            Write-Host "Adding WiX to PATH: $wixPath"
            echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "WiX default path not found, relying on pre-configured PATH"
          }

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Windows MSI Installer
        run: ./gradlew packageWindowsMsi --no-daemon

      - name: Upload Windows MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Envelopes-Windows-MSI
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Publish Release Assets
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          files: |
            build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
